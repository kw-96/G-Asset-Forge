version: '3.8'
services:
  nginx-proxy:
    image: nginx
    depends_on:
      - g-asset-forge-workbench
      - g-asset-forge-editor
      - g-asset-forge-server
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8080:80
  g-asset-forge-workbench:
    build:
      context: ../workbench
      dockerfile: ./Dockerfile
    depends_on:
      - g-asset-forge-server
    ports:
      - '8001:8001'

  g-asset-forge-editor:
    build:
      context: ../g-asset-forge
      dockerfile: ./Dockerfile
    ports:
      - '8002:8002'

  g-asset-forge-server:
    container_name: g-asset-forge-server
    build:
      context: ./
      dockerfile: ./Dockerfile
    depends_on:
      - postgres-container
    ports:
      - '5356:5356'
  # networks:
  #   - common-network

  postgres-container:
    image: postgres:16.3
    restart: always
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    # networks:
    #   - common-network

volumes:
  postgres:
